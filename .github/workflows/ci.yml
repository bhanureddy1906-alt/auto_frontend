name: CI
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/auto-frontend:${{ github.sha }}

      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: bhanureddy1906-alt/auto-frontend-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Update deployment.yaml
    run: |
      cd config
      git pull --rebase origin main
      sed -i "s|image: .*auto-frontend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/auto-frontend:${{ github.sha }}|g" deployment.yaml
      git config user.name "github-actions"
      git config user.email "actions@github.com"
      git commit -am "Deploy ${{ github.sha }}" || echo "No changes"
      git push origin main
